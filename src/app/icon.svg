<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <radialGradient id="badgeBlueBase" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0058FF" />
      <stop offset="55%" stop-color="#0035B8" />
      <stop offset="100%" stop-color="#001760" />
    </radialGradient>
    <filter id="bubbleDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000E38" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- 1. Outer Thick White Die-Cut Sticker Contour -->
  <circle cx="110" cy="110" r="106" fill="#FFFFFF" />

  <!-- 2. Royal Blue Inner Emblem Base -->
  <circle cx="110" cy="110" r="99" fill="url(#badgeBlueBase)" stroke="#001F6E" stroke-width="3.5" />

  <!-- 3. Gold Accent Dashed Ring -->
  <circle cx="110" cy="110" r="93" fill="none" stroke="#E2C275" stroke-width="2" stroke-dasharray="5 5" opacity="0.85" />

  <!-- 4. Bubble Lettering Group: HAN STUDIO -->
  <g
    filter="url(#bubbleDropShadow)"
    text-anchor="middle"
    font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="900"
  >
    <!-- HAN (Upper Bubble Word) -->
    <text
      x="110"
      y="98"
      font-size="64"
      letter-spacing="2"
      fill="#FFFFFF"
      stroke="#00207A"
      stroke-width="7"
      stroke-linejoin="round"
      paint-order="stroke fill"
    >
      HAN
    </text>

    <!-- STUDIO (Lower Bubble Word) -->
    <text
      x="110"
      y="146"
      font-size="36"
      letter-spacing="2.5"
      fill="#FFFFFF"
      stroke="#00207A"
      stroke-width="5"
      stroke-linejoin="round"
      paint-order="stroke fill"
    >
      STUDIO
    </text>
  </g>
</svg>
